<a class="skip" href="#main">Skip to content</a>
<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="{{ '/' | relative_url }}">Wenwu Gong</a>
    <nav class="nav-links" aria-label="Primary">
      {% assign here = page.url | remove: 'index.html' %}
      {% for link in site.links %}
        {% assign dest = link.url | remove: 'index.html' %}
        <a href="{{ link.url | relative_url }}" {% if here == dest %}aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
